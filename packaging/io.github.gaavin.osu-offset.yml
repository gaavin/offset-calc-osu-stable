app-id: io.github.gaavin.osu-offset
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
command: osu-offset
finish-args:
  - --filesystem=home
modules:
  - name: osu-offset
    buildsystem: simple
    build-commands:
      - install -D osu-offset /app/bin/osu-offset
      - install -D io.github.gaavin.osu-offset.desktop /app/share/applications/io.github.gaavin.osu-offset.desktop
      - install -D io.github.gaavin.osu-offset.svg /app/share/icons/hicolor/scalable/apps/io.github.gaavin.osu-offset.svg
      - install -D io.github.gaavin.osu-offset.metainfo.xml /app/share/metainfo/io.github.gaavin.osu-offset.metainfo.xml
    sources:
      - type: file
        path: osu-offset
      - type: file
        path: io.github.gaavin.osu-offset.desktop
      - type: file
        path: io.github.gaavin.osu-offset.svg
      - type: file
        path: io.github.gaavin.osu-offset.metainfo.xml
