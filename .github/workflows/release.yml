name: Release

on:
  push:
    branches: [master, main]
    paths:
      - "**/*.go"
      - "!**/*_test.go"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.stamp.outputs.version }}
      tag: ${{ steps.stamp.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: stamp
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          peel() {
            local t="$1" peeled
            peeled="$(git ls-remote --tags origin "refs/tags/${t}^{}" | awk '{print $1}')"
            if [ -z "$peeled" ]; then
              peeled="$(git ls-remote --tags origin "refs/tags/${t}" | awk '{print $1}')"
            fi
            printf '%s' "$peeled"
          }

          ts="$(git log -1 --format=%ct)"
          version="$(date -u -d "@${ts}" +%Y-%m-%d-%H%M%S)"
          tag="v${version}"
          existing="$(peel "$tag")"

          if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
            version="${version}-${RUN_NUMBER}"
            tag="v${version}"
            existing="$(peel "$tag")"
          fi

          if [ -n "$existing" ]; then
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "tag ${tag} already exists; refusing to overwrite"
              exit 1
            fi
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "release ${tag} already exists; refusing to overwrite"
              exit 1
            fi
            echo "tag ${tag} exists without a release; continuing"
          else
            git tag -a "$tag" -m "$tag"
            git push origin "$tag"
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "using ${tag}"

  binaries:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Cross-compile
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          build() {
            local goos="$1" goarch="$2"
            local ext=""
            if [ "$goos" = windows ]; then ext=".exe"; fi
            local name="osu-offset-${goos}-${goarch}${ext}"
            echo "building $name"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/${name}" ./cmd/osu-offset
            (cd dist && sha256sum "$name" > "${name}.sha256")
          }
          build linux amd64
          build linux arm64
          build windows amd64
          build windows arm64
      - uses: actions/upload-artifact@v4
        with:
          name: osu-offset-binaries
          path: dist/*

  publish:
    needs: [version, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: osu-offset-binaries
          path: release
      - name: Refuse overwrite
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release ${TAG} already exists; refusing to overwrite"
            exit 1
          fi
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: false
          files: release/*
