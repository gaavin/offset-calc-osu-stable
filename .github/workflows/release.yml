name: Release

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.stamp.outputs.version }}
      tag: ${{ steps.stamp.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: stamp
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          peel() {
            local t="$1" peeled
            peeled="$(git ls-remote --tags origin "refs/tags/${t}^{}" | awk '{print $1}')"
            if [ -z "$peeled" ]; then
              peeled="$(git ls-remote --tags origin "refs/tags/${t}" | awk '{print $1}')"
            fi
            printf '%s' "$peeled"
          }

          ts="$(git log -1 --format=%ct)"
          version="$(date -u -d "@${ts}" +%Y-%m-%d-%H%M%S)"
          tag="v${version}"
          existing="$(peel "$tag")"

          if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
            version="${version}-${RUN_NUMBER}"
            tag="v${version}"
            existing="$(peel "$tag")"
          fi

          if [ -n "$existing" ]; then
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "tag ${tag} already exists; refusing to overwrite"
              exit 1
            fi
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "release ${tag} already exists; refusing to overwrite"
              exit 1
            fi
            echo "tag ${tag} exists without a release; continuing"
          else
            git tag -a "$tag" -m "$tag"
            git push origin "$tag"
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "using ${tag}"

  binaries:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Cross-compile
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          build() {
            local goos="$1" goarch="$2"
            local ext=""
            if [ "$goos" = windows ]; then ext=".exe"; fi
            local name="osu-offset-${goos}-${goarch}${ext}"
            echo "building $name"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/${name}" ./cmd/osu-offset
            (cd dist && sha256sum "$name" > "${name}.sha256")
          }
          build linux amd64
          build linux arm64
          build darwin amd64
          build darwin arm64
          build windows amd64
          build windows arm64
      - uses: actions/upload-artifact@v4
        with:
          name: osu-offset-binaries
          path: dist/*

  linux-pkg:
    needs: [version, binaries]
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            appimage_arch: x86_64
            runner: ubuntu-latest
          - goarch: arm64
            appimage_arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: osu-offset-binaries
          path: dist
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl ca-certificates file git librsvg2-bin librsvg2-common \
            appstream appstream-compose \
            flatpak flatpak-builder elfutils python3
      - name: Build AppImage
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          chmod +x packaging/build-appimage.sh
          packaging/build-appimage.sh \
            "dist/osu-offset-linux-${{ matrix.goarch }}" \
            "$VERSION" dist "${{ matrix.appimage_arch }}"
      - name: Build Flatpak
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          chmod +x packaging/build-flatpak.sh
          packaging/build-flatpak.sh \
            "dist/osu-offset-linux-${{ matrix.goarch }}" \
            "$VERSION" dist "${{ matrix.appimage_arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: osu-offset-linux-${{ matrix.appimage_arch }}
          path: |
            dist/osu-offset-${{ matrix.appimage_arch }}.AppImage
            dist/osu-offset-${{ matrix.appimage_arch }}.AppImage.sha256
            dist/osu-offset-${{ matrix.appimage_arch }}.flatpak
            dist/osu-offset-${{ matrix.appimage_arch }}.flatpak.sha256

  publish:
    needs: [version, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: osu-offset-binaries
          path: release
      - name: Refuse overwrite
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release ${TAG} already exists; refusing to overwrite"
            exit 1
          fi
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: false
          files: release/*

  publish-linux:
    needs: [version, linux-pkg, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: osu-offset-linux-*
          path: release
          merge-multiple: true
      - name: Attach Linux packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release/*.AppImage release/*.AppImage.sha256 release/*.flatpak release/*.flatpak.sha256)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no AppImage/Flatpak artifacts to attach"
            exit 0
          fi
          ls -la "${files[@]}"
          gh release upload "$TAG" "${files[@]}"
